name: Verify

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q superlocal_harness tests
      - run: node --check superlocal_harness/static/app.js
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.demo
